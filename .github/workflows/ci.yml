name: CI

on:
  push:
    branches: [main, chore/setup-tooling]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HUSKY: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier . --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

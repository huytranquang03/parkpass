<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkPass · Đăng nhập thất bại</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;background:#F1F5F9;color:#0F172A}
a{color:#0F766E}a:hover{color:#115E59}
input,select,button,textarea{font:inherit;color:inherit}
@keyframes pp-spin{to{transform:rotate(360deg)}}
@keyframes pp-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.pp-spin{animation:pp-spin 1s linear infinite;transform-origin:center}
.pp-skeleton{background:linear-gradient(90deg,#F1F5F9 0%,#E2E8F0 50%,#F1F5F9 100%);background-size:200% 100%;animation:pp-shimmer 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.pp-spin,.pp-skeleton{animation:none}}
</style>
<style>
/* Khung canvas: artboard giu nguyen kich thuoc 1280x840 nhu tren design canvas. Moi gia tri inline style la px CSS, doc truc tiep bang DevTools. */
body{padding:24px;min-width:1328px}
</style>
</head>
<body>
<div style="width: 1280px; height: 840px; box-sizing: border-box; display: flex; flex-direction: column; background: #F1F5F9; overflow: hidden; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0F172A">
<div style="height: 40px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #F1F5F9; color: #475569; font-size: 12px; line-height: 16px; font-weight: 500">
<span>07b · Login · lỗi 401, giữ nội dung đã nhập</span>
<span>Desktop · 1280px</span>
</div>
<div style="width: 1280px; height: 800px; flex-shrink: 0; background: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; position: relative">
<header data-component="AppHeader" style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; gap: 24px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; box-shadow: 0 1px 2px rgb(15 23 42 / .06); position: relative; z-index: 20">
<a href="Main.html" data-component="Logo" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #0F172A; font-size: 18px; line-height: 28px; font-weight: 700">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #0F766E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg  width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 9V6h20v3a3 3 0 0 0 0 6v3H2v-3a3 3 0 0 0 0-6z"/><path d="M13 6v12"/></svg></span>ParkPass
</a>
<div data-component="SearchBox" style="flex: 1 1 auto; max-width: 480px; height: 44px; box-sizing: border-box; border: 1px solid #64748B; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #64748B; position: relative">
<svg  width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Tìm attraction</label>
<input id="search" type="search" placeholder="Tìm attraction, công viên..." value="" style="flex: 1 1 auto; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; font-size: 16px; line-height: 24px; color: #0F172A; padding: 0">
<kbd style="height: 22px; padding: 0 6px; box-sizing: border-box; border: 1px solid #E2E8F0; border-radius: 6px; font-family: inherit; font-size: 12px; line-height: 20px; color: #64748B; background: #F1F5F9">/</kbd>
</div>
<div style="flex: 1 1 auto"></div>
<button type="button" data-component="ThemeToggle" aria-label="Đổi giao diện sáng tối" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #475569; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg  width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<a href="CartDrawer.html" data-component="CartButton" aria-label="Giỏ vé, 0 vé" style="width: 44px; height: 44px; border-radius: 8px; color: #475569; display: inline-flex; align-items: center; justify-content: center; position: relative; text-decoration: none">
<svg  width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
<span style="position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #0F766E; color: #FFFFFF; font-size: 12px; line-height: 18px; font-weight: 600; text-align: center">0</span>
</a>
<a href="Orders.html" data-component="Avatar" aria-label="Tài khoản và đơn hàng" style="width: 36px; height: 36px; border-radius: 999px; background: #F0FDFA; color: #0F766E; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">HT</a>
</header><div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; background: #F1F5F9; padding: 40px 0"><div data-component="LoginCard" style="width: 400px; box-sizing: border-box; padding: 32px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 1px 2px rgb(15 23 42 / .06); display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700">Đăng nhập</h1>
<p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #475569">Để xem đơn hàng và thanh toán nhanh hơn.</p>
<div role="alert" data-component="Alert" data-variant="danger" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 8px; background: #FEE2E2; color: #991B1B; font-size: 14px; line-height: 20px; margin-top: 20px">
<span style="display: inline-flex; margin-top: 1px"><svg  width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></span><span><strong style="font-weight: 600">Đăng nhập thất bại (401).</strong> Email hoặc mật khẩu không đúng. Nội dung đã nhập được giữ nguyên.</span>
</div>
<form style="display: flex; flex-direction: column; gap: 20px; margin-top: 24px">
<div data-component="Field" data-kind="input" data-state="error" style="width: 100%; display: flex; flex-direction: column"><label for="login-email" style="font-size: 14px; line-height: 20px; font-weight: 500; color: #0F172A; margin-bottom: 6px">Email</label><div style="position: relative"><input id="login-email" type="email" value="demo@parkpass.vn" placeholder="ban@vidu.vn" aria-invalid="true" aria-describedby="login-email-error" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #DC2626; border-radius: 8px; padding: 0 12px 0 12px; background: #FFFFFF; color: #0F172A; font-size: 16px; line-height: 24px;"></div><div id="login-email-error" style="font-size: 12px; line-height: 16px; color: #DC2626; margin-top: 6px">Kiểm tra lại email</div></div>
<div data-component="Field" data-kind="input" data-state="default" style="width: 100%; display: flex; flex-direction: column"><label for="login-pw" style="font-size: 14px; line-height: 20px; font-weight: 500; color: #0F172A; margin-bottom: 6px">Mật khẩu</label><div style="position: relative"><input id="login-pw" type="password" value="••••••••" placeholder="Tối thiểu 8 ký tự" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #64748B; border-radius: 8px; padding: 0 40px 0 12px; background: #FFFFFF; color: #0F172A; font-size: 16px; line-height: 24px;"><span style="position: absolute; right: 12px; top: 14px; display: inline-flex"><svg  width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span></div></div>
<button type="button" data-component="Button" data-variant="primary" data-size="lg" data-state="default" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid transparent; background: #0F766E; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; "><span>Đăng nhập</span></button>
</form>
<p style="margin: 16px 0 0; font-size: 12px; line-height: 16px; color: #475569; text-align: center">Tài khoản test: <span style="font-weight: 500; color: #0F172A">demo@parkpass.vn</span> / <span style="font-weight: 500; color: #0F172A">Demo@123</span></p>
</div></div>
</div>
</div>
</body>
</html>
